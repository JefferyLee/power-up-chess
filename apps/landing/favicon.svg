<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Power Up Castle">
  <!-- Castle-night ground: rounded square, same palette as the
       Hall + Terminal + the brand mark PNGs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2a4a"/>
      <stop offset="100%" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d774"/>
      <stop offset="60%" stop-color="#c89b3f"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Heraldic rook silhouette — wider base + narrow neck + crenellated
       crown. Simplified for the 32px scale (Candidate 4's metallic
       3D rendering doesn't carry below ~128px; flat gold reads cleaner
       at favicon sizes). -->
  <path
    d="M 8 27
       L 8 22 L 9.5 21
       L 9.5 13 L 8 11
       L 8 7 L 11 7 L 11 9 L 13 9 L 13 7 L 15.3 7 L 15.3 9 L 16.7 9 L 16.7 7 L 19 7 L 19 9 L 21 9 L 21 7 L 24 7
       L 24 11 L 22.5 13
       L 22.5 21 L 24 22
       L 24 27 Z"
    fill="url(#gold)"
    stroke="#4a3010"
    stroke-width="0.6"
    stroke-linejoin="round"
  />

  <!-- Inset shield carved into the rook's torso — the heraldic
       coat-of-arms shape from Candidate 4. Darker fill so the
       lightning inside reads on top. -->
  <path
    d="M 11.5 13
       L 20.5 13
       L 20.5 18
       Q 20.5 21 16 22.5
       Q 11.5 21 11.5 18 Z"
    fill="#0e1a2e"
    stroke="#8a6520"
    stroke-width="0.5"
    stroke-linejoin="round"
  />

  <!-- Lightning bolt inside the shield — gold so it pops on the
       dark shield ground. Single bolt, no sparkle particles —
       favicon-scale legibility. -->
  <path
    d="M 17 14
       L 14.5 18.2
       L 16.2 18.2
       L 14.8 21
       L 18 17
       L 16.3 17 Z"
    fill="url(#gold)"
  />
</svg>
