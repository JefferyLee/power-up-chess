<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Power Up Castle">
  <!-- Castle-night background; matches the terminal + Hall accent palette. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a58"/>
      <stop offset="100%" stop-color="#0a0418"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e8b6"/>
      <stop offset="55%" stop-color="#f4c266"/>
      <stop offset="100%" stop-color="#a87a18"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="url(#bg)"/>

  <!-- Chess rook silhouette — also reads as a castle tower with three
       crenellations. Double-encodes the brand: castle + chess. -->
  <path
    d="M 8 27 L 8 8 L 12 8 L 12 12 L 14 12 L 14 8 L 18 8 L 18 12 L 20 12 L 20 8 L 24 8 L 24 27 Z"
    fill="url(#gold)"
  />

  <!-- Tower door arch (dark cutout). -->
  <path
    d="M 13 27 L 13 21 Q 16 18 19 21 L 19 27 Z"
    fill="url(#bg)"
  />

  <!-- Power-up spark above the tower — the one "active" pixel that
       turns the castle from a static mark into Power Up Castle. -->
  <g fill="#fff7d8">
    <circle cx="16" cy="3.5" r="1.2"/>
    <polygon points="16,1.2 16.5,3 18.3,3.5 16.5,4 16,5.8 15.5,4 13.7,3.5 15.5,3" opacity="0.85"/>
  </g>
</svg>
